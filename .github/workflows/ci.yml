name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

env:
  TF_VERSION: 1.13.4

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --no-banner

  terraform-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - run: terraform fmt -check -recursive
      - name: validate
        run: |
          for d in bootstrap envs/prod; do
            terraform -chdir=$d init -backend=false -input=false && terraform -chdir=$d validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"
        env: { GITHUB_TOKEN: "${{ github.token }}" }

  checkov:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: checkov.sarif, category: checkov }

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  app-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: app/requirements.txt }
      - run: pip install -r requirements.txt pytest httpx ruff pip-audit
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  plan:
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: [terraform-lint, checkov, trivy-config, app-test]
    runs-on: ubuntu-latest
    environment: prod-plan
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - name: plan (current image)
        working-directory: envs/prod
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
          IMAGE=$(terraform output -raw image 2>/dev/null || echo "${{ vars.ECR_REPOSITORY_URL }}:bootstrap")
          terraform plan -input=false -lock=false -no-color \
            -var "owner=${{ vars.OWNER_EMAIL }}" -var "alert_email=${{ vars.OWNER_EMAIL }}" -var "image=$IMAGE" \
            -var "teardown_friendly=${{ vars.TEARDOWN_FRIENDLY || 'true' }}" | tee plan.txt
          { echo '### Terraform plan'; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
